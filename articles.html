<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Articles · Taste Vietnam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="page">
    <div class="page-hero">
      <h1>TIN TỨC</h1>
    </div>

    <div class="flex flex-wrap gap-3 mb-6">
      <input id="article-search" type="search" placeholder="Search articles…" class="flex-1 min-w-[200px] px-3 py-2 border border-gray-300 bg-white" />
      <select id="article-filter" class="px-3 py-2 border border-gray-300 bg-white">
        <option value="">Tất cả</option>
      </select>
    </div>

    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5" id="articles-grid">
      <p class="muted">Loading…</p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/articles.js"></script>
</body>
</html>
