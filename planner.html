<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Planner · Taste Vietnam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="page">
    <div class="page-hero">
      <h1>Food Planner</h1>
      <p>Plan morning, lunch, and dinner for 7 days. Data is saved in localStorage.</p>
    </div>

    <div class="flex flex-wrap items-center gap-3 mb-4">
      <button type="button" class="btn btn--ghost" id="week-prev">← Prev week</button>
      <label>
        Week starts:
        <input type="date" id="planner-start" class="px-3 py-2 border border-gray-300 bg-white ml-1" />
      </label>
      <button type="button" class="btn btn--ghost" id="week-next">Next week →</button>
    </div>

    <div class="planner-wrap">
      <table class="planner-table" id="planner-table">
        <thead>
          <tr>
            <th>Day</th>
            <th>Morning</th>
            <th>Lunch</th>
            <th>Dinner</th>
          </tr>
        </thead>
        <tbody id="planner-body"></tbody>
      </table>
    </div>
  </main>

  <div class="modal" id="food-modal" aria-hidden="true">
    <div class="modal__panel">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-xl m-0">Add food</h2>
        <button type="button" class="btn btn--ghost" id="modal-close">Close</button>
      </div>
      <input type="search" id="modal-search" placeholder="Search food…" class="w-full px-3 py-2 border border-gray-300 bg-white" />
      <div class="pick-list" id="modal-list"></div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/planner.js"></script>
</body>
</html>
