<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Explore Foods · Vietnam Food Guide</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <div id="site-header"></div>

    <main class="page">
      <!-- Page introduction -->
      <div class="page-hero">
        <h1>Explore Vietnamese Foods</h1>

        <p>
          Discover Vietnamese dishes from different regions, categories, and
          culinary traditions.
        </p>
      </div>

      <!-- Search + Filter -->
      <div class="explore-toolbar">
        <!-- Search -->
        <div class="search-bar">
          <input
            id="explore-search"
            type="search"
            placeholder="Search for a food…"
            data-i18n-placeholder="explore.searchPlaceholder"
            autocomplete="off"
          />
        </div>

        <!-- Filter button -->
        <button
          id="filter-toggle"
          type="button"
          class="filter-toggle-btn"
          aria-expanded="false"
          aria-controls="food-filters"
        >
          <span data-filter-label>Filter</span>
          <span id="filter-arrow">v</span>
        </button>
      </div>

      <!-- Filter menu -->
      <section class="food-filter">
        <div id="food-filters" class="filter-menu" hidden></div>
      </section>

      <!-- Selected filters -->
      <!--
      explore.js sẽ tự render:
      - các filter đang được chọn
      - nút Clear all khi có ít nhất một filter
    -->
      <div id="active-filters" class="active-filters"></div>
      <div class="clear-btn">
        <button type="button" id="clear-filters" class="clear-filters" hidden>
          Clear all
        </button>
      </div>

      <!-- Search / filter status -->
      <p class="muted mb-4" id="explore-status"></p>

      <!-- Food results -->
      <div class="food-grid" id="explore-grid">
        <p class="muted" data-i18n="explore.loading">Loading…</p>
      </div>
    </main>

    <div id="site-footer"></div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/explore.js"></script>
  </body>
</html>
