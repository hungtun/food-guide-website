<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Province & Food Explorer · Vietnam Food Guide</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="page">
    <div class="page-hero">
      <h1 id="explorer-title">Food Explorer</h1>
      <p>Browse specialties by province — scroll each row like a food playlist.</p>
    </div>

    <div class="flex flex-wrap gap-3 mb-6 items-end">
      <div class="form-field">
        <label for="filter-region">Region</label>
        <select id="filter-region">
          <option value="">All regions</option>
          <option value="north">North</option>
          <option value="central">Central</option>
          <option value="south">South</option>
        </select>
      </div>
      <div class="form-field">
        <label for="filter-province">Province</label>
        <select id="filter-province">
          <option value="">All provinces</option>
        </select>
      </div>
      <div class="form-field">
        <label for="sort-foods">Sort</label>
        <select id="sort-foods">
          <option value="name">Name</option>
          <option value="price-asc">Price ↑</option>
          <option value="price-desc">Price ↓</option>
          <option value="rating">Rating</option>
        </select>
      </div>
      <div class="form-field flex-1 min-w-[180px]">
        <label for="search-explorer">Search</label>
        <input id="search-explorer" type="search" placeholder="Search foods…" />
      </div>
    </div>

    <div id="explorer-rows">
      <p class="muted">Loading foods…</p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/explorer.js"></script>
</body>
</html>
